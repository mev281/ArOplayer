name: aroplayer
description: ArOplayer - IPTV ve medya oynatici
publish_to: 'none'
version: 1.1.2+13

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  http: ^1.2.0
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  wakelock_plus: ^1.2.8
  path_provider: ^2.1.2
  device_info_plus: 10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
