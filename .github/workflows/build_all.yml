name: Build All

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create platform folders
        run: flutter create --platforms=android,windows --org com.aroplayer --project-name aroplayer .

      - name: Set package id to com.aroplayer.app
        run: |
          sed -i 's/com\.aroplayer\.aroplayer/com.aroplayer.app/g' android/app/build.gradle* || true
          rm -rf android/app/src/main/kotlin/com/aroplayer/aroplayer

      - name: Configure release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS"
          echo "$KS_B64" | base64 -d > android/app/aroplayer-release.p12
          python3 - <<'PY'
          import os, re
          pw = os.environ["KS_PASS"]
          if os.path.exists("android/app/build.gradle.kts"):
              p = "android/app/build.gradle.kts"
              s = open(p).read()
              block = ('    signingConfigs {\n        create("release") {\n'
                       '            storeFile = file("aroplayer-release.p12")\n'
                       '            storeType = "pkcs12"\n'
                       '            storePassword = System.getenv("KS_PASS")\n'
                       '            keyAlias = "aroplayer"\n'
                       '            keyPassword = System.getenv("KS_PASS")\n'
                       '            enableV1Signing = true\n'
                       '            enableV2Signing = true\n'
                       '        }\n    }\n\n')
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
              s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          else:
              p = "android/app/build.gradle"
              s = open(p).read()
              block = ("    signingConfigs {\n        release {\n"
                       "            storeFile file('aroplayer-release.p12')\n"
                       "            storeType 'pkcs12'\n"
                       "            storePassword System.getenv('KS_PASS')\n"
                       "            keyAlias 'aroplayer'\n"
                       "            keyPassword System.getenv('KS_PASS')\n"
                       "            v1SigningEnabled true\n"
                       "            v2SigningEnabled true\n"
                       "        }\n    }\n\n")
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
              s = s.replace("signingConfigs.debug", "signingConfigs.release")
          open(p, "w").write(s)
          PY
          grep -n "signingConfig" android/app/build.gradle*

      - name: Pin Android plugin versions for Flutter 3.24
        run: |
          printf 'dependency_overrides:
  screen_brightness_android: 2.1.0
  media_kit_video: 1.2.5
' > pubspec_overrides.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Pin minSdk to 21
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdk(Version)?[[:space:]]*(=[[:space:]]*)?(flutter\.minSdkVersion|[0-9]+)/minSdkVersion 21/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk(Version)?[[:space:]]*(=[[:space:]]*)?(flutter\.minSdkVersion|[0-9]+)/minSdk = 21/' android/app/build.gradle.kts
          fi
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Force minSdk 21 via Gradle init script
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/minsdk.gradle <<'GRADLE'
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('com.android.application')) {
                      p.android.defaultConfig.minSdk = 21
                  }
              }
          }
          GRADLE

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify minSdk is 21
        run: |
          M=$(find build/app/intermediates -name AndroidManifest.xml -path "*merged_manifest*" | head -1)
          grep -n 'minSdkVersion="21"' "$M"

      - name: Verify APK has v1 signature
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E "META-INF/[^/]+\.(RSA|DSA|EC)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArOplayer-FireTV-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create platform folders
        run: flutter create --platforms=android,windows --org com.aroplayer --project-name aroplayer .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ArOplayer-Windows.zip -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: ArOplayer-Windows-zip
          path: ArOplayer-Windows.zip
          if-no-files-found: error
